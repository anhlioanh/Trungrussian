<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện tập — Học tiếng Nga cùng Oanh</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .mode { text-align: left; font: inherit; cursor: pointer; padding: 15px 16px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--surface); color: var(--text); transition: border-color .15s, background .15s; }
  .mode:hover:not(:disabled) { border-color: var(--brand); background: var(--brand-soft); }
  .mode.on { border-color: var(--brand); background: var(--brand-soft); }
  .mode:disabled { opacity: .5; cursor: not-allowed; }
  .mode b { display: block; margin-bottom: 3px; }
  .mode small { color: var(--text-mute); font-size: .8rem; line-height: 1.45; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: .84rem; cursor: pointer; padding: 6px 13px; border-radius: 99px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .exq { padding: 16px 18px; border-left: 3px solid var(--border); }
  .exq.ok { border-left-color: var(--ok); }
  .exq.bad { border-left-color: var(--err); }
  .qn { width: 24px; height: 24px; flex: none; border-radius: 7px; background: var(--bg-soft);
    display: grid; place-items: center; font-size: .76rem; font-weight: 700; color: var(--text-mute); }
  .qtext { font-weight: 600; margin-bottom: 10px; }
  .opts { display: grid; gap: 6px; }
  .opt { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); cursor: pointer; background: var(--surface-2); }
  .opt:hover { border-color: var(--brand); }
  .inp, select { font: inherit; padding: 9px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text); min-width: 180px; }
  .inp { font-family: var(--font-ru); font-size: 1.05rem; flex: 1; }
  select.good { border-color: var(--ok); }
  select.bad { border-color: var(--err); }
  .match-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; flex-wrap: wrap; }
  .match-row .ru { min-width: 120px; font-size: 1.05rem; font-weight: 600; }
  .fb { margin-top: 10px; padding: 9px 12px; border-radius: var(--radius-sm); font-size: .89rem; }
  .fb.good { background: var(--ok-soft); color: var(--ok); }
  .fb.wrong { background: var(--err-soft); color: var(--err); }
  .kb { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .kb button { font-family: var(--font-ru); font-size: .95rem; width: 32px; height: 32px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  .kb button:hover { background: var(--brand-soft); }
  .score-box { text-align: center; padding: 26px; }
  .score-box .big { font-family: var(--font-display); font-size: 3rem; line-height: 1; color: var(--brand); }
  .src { font-size: .75rem; color: var(--text-mute); margin-top: 8px; }
  .src a { color: var(--text-mute); }
</style>
</head>
<body>
<div id="nav"></div>

<div class="wrap narrow" id="page"></div>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="data/course.js"></script>
<script src="data/lessons/a0.js"></script>
<script src="data/lessons/a1.js"></script>
<script src="data/lessons/a2.js"></script>
<script src="data/lessons/b1.js"></script>
<script src="data/lessons/b2.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/dict.js"></script>
<script src="assets/js/lesson.js"></script>
<script src="assets/js/auth.js"></script>
<script>
Auth.guard(function () {
const guest = Auth.isGuest();
mountChrome('luyentap.html');
touchStreak();

const page = document.getElementById('page');
const d = Store.load();

/* ---------- gom toàn bộ câu bài tập đang có, kèm nguồn gốc ---------- */
/* Không viết câu hỏi mới: lấy lại 980 câu đã nằm trong các bài học,
   nhưng cho phép trộn tự do ngoài trình tự bài. */
function pool() {
  const out = [];
  Object.keys(LESSON_DATA).forEach(id => {
    if (guest && !FREE_LESSONS.includes(id)) return;
    const lv = id.split('-')[0];
    const meta = (LESSONS[lv] || []).find(l => l.id === id);
    if (!meta) return;
    (LESSON_DATA[id].ex || []).forEach((q, i) => {
      out.push({ q, lid: id, lv, n: i + 1, title: meta.title });
    });
  });
  return out;
}
const ALL = pool();

/* những câu người học từng làm sai — lấy từ Store.lessons[...].wrong */
function wrongOnes() {
  const out = [];
  Object.keys(d.lessons || {}).forEach(id => {
    const rec = d.lessons[id];
    if (!rec || !rec.wrong || !rec.wrong.length) return;
    rec.wrong.forEach(n => {
      const item = ALL.find(x => x.lid === id && x.n === n);
      if (item) out.push(item);
    });
  });
  return out;
}

/* các cấp thực sự có câu để luyện */
const LEVELS = COURSE.levels.filter(lv => ALL.some(x => x.lv === lv.id));
const WRONG = wrongOnes();

let mode = 'mix', lvSel = 'all', count = 10;

/* ---------- màn hình chọn ---------- */
function setup() {
  const learned = ALL.filter(x => d.lessons[x.lid] && d.lessons[x.lid].done);

  page.innerHTML = `
    <section style="margin:30px 0 16px">
      <h1 style="margin-bottom:6px">Luyện tập</h1>
      <p class="soft">Trộn lại các câu bài tập trong khoá để em luyện bất cứ lúc nào, không cần đi theo trình tự bài.
        Ở đây <b>không tính điểm vào tiến độ</b> — làm sai thoải mái, không mất gì cả.</p>
    </section>

    <section class="card">
      <h3 style="margin-top:0">Luyện kiểu gì</h3>
      <div class="mode-grid">
        <button class="mode ${mode==='mix'?'on':''}" data-mode="mix" type="button">
          <b>Trộn tất cả</b><small>Ngữ pháp, từ vựng, nghe — lẫn lộn như đời thật</small></button>
        <button class="mode ${mode==='listen'?'on':''}" data-mode="listen" type="button">
          <b>Chỉ luyện nghe</b><small>Máy đọc tiếng Nga, em gõ lại</small></button>
        <button class="mode ${mode==='learned'?'on':''}" data-mode="learned" type="button" ${learned.length?'':'disabled'}>
          <b>Bài đã học</b><small>${learned.length?`Chỉ lấy câu trong ${new Set(learned.map(x=>x.lid)).size} bài em đã xong`:'Chưa học xong bài nào'}</small></button>
        <button class="mode ${mode==='wrong'?'on':''}" data-mode="wrong" type="button" ${WRONG.length?'':'disabled'}>
          <b>Câu em từng sai</b><small>${WRONG.length?`${WRONG.length} câu em đã làm sai trước đây`:'Chưa có câu sai nào được ghi'}</small></button>
      </div>

      <h3 style="margin:22px 0 8px">Cấp độ</h3>
      <div class="chips" id="lvs">
        <button class="chip ${lvSel==='all'?'on':''}" data-lv="all" type="button">Tất cả</button>
        ${LEVELS.map(lv=>`<button class="chip ${lvSel===lv.id?'on':''}" data-lv="${lv.id}" type="button">${esc(lv.code)}</button>`).join('')}
      </div>

      <h3 style="margin:22px 0 8px">Bao nhiêu câu</h3>
      <div class="chips" id="cnts">
        ${[5,10,20].map(n=>`<button class="chip ${count===n?'on':''}" data-n="${n}" type="button">${n} câu</button>`).join('')}
      </div>

      <div id="avail" class="small soft" style="margin-top:18px"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn btn-primary" id="go">Bắt đầu luyện</button>
        <a class="btn btn-ghost" href="index.html">Về trang chủ</a>
      </div>
    </section>

    ${guest ? `<div id="gnote" style="margin-top:14px"></div>` : ''}`;

  if (guest) document.getElementById('gnote').innerHTML = guestBox(
    'Em đang học thử nên chỉ luyện được câu của ba bài mở sẵn. Tạo tài khoản là mở hết kho câu.', 'luyentap.html');

  page.querySelectorAll('.mode').forEach(b => b.onclick = () => { mode = b.dataset.mode; setup(); });
  page.querySelectorAll('#lvs .chip').forEach(b => b.onclick = () => { lvSel = b.dataset.lv; setup(); });
  page.querySelectorAll('#cnts .chip').forEach(b => b.onclick = () => { count = +b.dataset.n; setup(); });

  const n = pick().length;
  document.getElementById('avail').textContent =
    n ? `Đang có ${n} câu hợp với lựa chọn trên.` : 'Không có câu nào hợp với lựa chọn này — em đổi kiểu luyện hoặc đổi cấp nhé.';
  document.getElementById('go').disabled = !n;
  document.getElementById('go').onclick = () => run(shuffle(pick()).slice(0, count));
}

/* lọc theo lựa chọn hiện tại */
function pick() {
  let src = mode === 'wrong' ? WRONG
          : mode === 'learned' ? ALL.filter(x => d.lessons[x.lid] && d.lessons[x.lid].done)
          : ALL;
  if (mode === 'listen') src = src.filter(x => x.q.t === 'listen');
  if (lvSel !== 'all') src = src.filter(x => x.lv === lvSel);
  return src;
}

/* ---------- làm bài ---------- */
function run(items) {
  const ex = items.map(x => x.q);

  page.innerHTML = `
    <section style="margin:26px 0 14px">
      <h1 style="margin-bottom:4px">Luyện tập — ${ex.length} câu</h1>
      <p class="soft small mb0">Làm hết rồi bấm “Chấm bài”. Kết quả ở đây không ghi vào tiến độ.</p>
    </section>
    <div class="card" style="padding:12px 16px;margin-bottom:14px">
      <div class="tiny muted" style="margin-bottom:2px">Không có bàn phím tiếng Nga? Bấm chữ ở đây.</div>
      <div class="kb" id="kb"></div>
    </div>
    <div class="grid" style="gap:10px" id="exs">${renderExercises(ex)}</div>
    <div class="row" style="margin-top:18px">
      <button class="btn btn-primary" id="grade">Chấm bài</button>
      <button class="btn btn-ghost" id="back">Chọn lại</button>
    </div>
    <div id="result"></div>`;

  /* ghi rõ mỗi câu lấy từ bài nào — để sai thì biết quay lại đâu */
  page.querySelectorAll('#exs .exq').forEach((el, i) => {
    const s = items[i];
    const p = document.createElement('div');
    p.className = 'src';
    p.innerHTML = `từ bài <a href="hoc.html?id=${esc(s.lid)}">${esc(Dict.levelName(s.lv))} · ${esc(s.title)}</a>`;
    el.appendChild(p);
  });

  const kb = document.getElementById('kb');
  kb.innerHTML = 'абвгдеёжзийклмнопрстуфхцчшщъыьэюя'.split('')
    .map(c => `<button type="button" data-k="${c}">${c}</button>`).join('') +
    '<button type="button" data-k=" " style="width:64px">␣</button><button type="button" data-k="⌫" style="width:44px">⌫</button>';
  let last = null;
  document.addEventListener('focusin', e => { if (e.target.classList.contains('inp')) last = e.target; });
  kb.addEventListener('click', e => {
    const b = e.target.closest('[data-k]'); if (!b) return;
    const t = last || document.querySelector('.inp'); if (!t) return;
    const k = b.getAttribute('data-k');
    t.value = (k === '⌫') ? t.value.slice(0, -1) : t.value + k;
    t.focus();
  });

  document.getElementById('back').onclick = setup;
  document.getElementById('grade').onclick = () => {
    const correct = gradeExercises(ex, document.getElementById('exs'));
    const pct = Math.round(correct / ex.length * 100);
    document.getElementById('result').innerHTML = `
      <div class="card score-box" style="margin-top:16px">
        <div class="big">${correct}/${ex.length}</div>
        <div class="pill ${pct >= 70 ? 'pill-ok' : 'pill-accent'}" style="margin:10px 0">${pct}%</div>
        <p class="soft small" style="max-width:44ch;margin:0 auto 14px">
          ${pct >= 70 ? 'Chắc rồi đấy. Muốn khó hơn thì tăng số câu hoặc chọn cấp cao hơn.'
                      : 'Chỗ sai đã chỉ rõ ở từng câu, và có ghi câu đó lấy từ bài nào — quay lại bài đó đọc lại một lượt là ổn.'}
        </p>
        <div class="row" style="justify-content:center">
          <button class="btn btn-primary" id="again">Luyện tiếp ${ex.length} câu khác</button>
          <button class="btn btn-ghost" id="back2">Đổi kiểu luyện</button>
        </div>
      </div>`;
    document.getElementById('again').onclick = () => run(shuffle(pick()).slice(0, count));
    document.getElementById('back2').onclick = setup;
    document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
  window.scrollTo({ top: 0 });
}

setup();

}, { guest: true });
</script>
</body>
</html>
